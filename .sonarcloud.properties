# SonarCloud Automatic Analysis Configuration
sonar.organization=skyboo21
sonar.projectKey=Skyboo21_NexedAI
sonar.projectName=NexedAI

sonar.sources=app,src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.ts,tests/**/*.tsx
sonar.exclusions=node_modules/**,.next/**,dist/**,out/**,coverage/**,**/*.config.*,src/views/**,src/data/**,scripts/**,docs/**,**/*.test.ts,**/*.test.tsx

sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json
