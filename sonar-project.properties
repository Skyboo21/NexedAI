# SonarQube Static Analysis Configuration
# Proyek Akhir D3 Teknik Informatika SV UNS 2026: NexedAI
sonar.projectKey=NexedAI
sonar.projectName=NexedAI - Adaptive Learning Platform
sonar.projectVersion=1.0.0

sonar.sources=app,src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx
sonar.exclusions=node_modules/**,.next/**,dist/**,out/**,coverage/**,**/*.config.*

sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# Quality Gate Enforcement (0 Vulnerabilities, 0 Security Hotspots)
sonar.qualitygate.wait=true
