# SonarQube Static Analysis Configuration
# Proyek SRS: NexedAI (Bab 8: Modern Build Tools & Quality Gate)
sonar.projectKey=uns-fastbuild-nexedai
sonar.projectName=UNS FastBuild - NexedAI Front-End
sonar.projectVersion=1.0.0

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**

sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# Quality Gate Thresholds
sonar.qualitygate.wait=true
