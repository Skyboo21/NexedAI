<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - NEXED AI</title>
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Outfit', sans-serif; }
    .glass-panel {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex items-center justify-center antialiased relative overflow-hidden">

  <!-- Ambient Background -->
  <div class="absolute -top-40 -right-40 w-96 h-96 bg-purple-600 rounded-full mix-blend-screen filter blur-[150px] opacity-40"></div>
  <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-blue-600 rounded-full mix-blend-screen filter blur-[150px] opacity-40"></div>

  <main class="w-full max-w-md p-8 sm:p-10 glass-panel rounded-3xl shadow-2xl relative z-10 m-4 border-t border-white/20">
    
    <div class="text-center mb-10">
      <div class="w-16 h-16 bg-gradient-to-br from-purple-500 to-blue-600 rounded-2xl mx-auto flex items-center justify-center font-bold text-white shadow-lg shadow-purple-500/40 text-2xl mb-4">NX</div>
      <h1 class="text-3xl font-extrabold text-white tracking-tight">Selamat Datang</h1>
      <p class="text-slate-400 mt-2 font-light">Masuk ke platform pembelajaran NEXED AI</p>
    </div>

    <form id="login-form" class="space-y-5" novalidate>
      <div>
        <label for="email" class="block text-sm font-medium text-slate-300 mb-1.5">Email Akses</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" /><path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" /></svg>
          </div>
          <input type="email" id="email" required class="w-full pl-10 pr-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-purple-500 focus:outline-none text-white text-sm transition-all shadow-inner" placeholder="anda@institusi.ac.id">
        </div>
      </div>
      
      <div>
        <div class="flex justify-between items-center mb-1.5">
          <label for="password" class="block text-sm font-medium text-slate-300">Kata Sandi</label>
          <a href="#" class="text-xs text-purple-400 hover:text-purple-300 transition-colors">Lupa sandi?</a>
        </div>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" /></svg>
          </div>
          <input type="password" id="password" required class="w-full pl-10 pr-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-purple-500 focus:outline-none text-white text-sm transition-all shadow-inner" placeholder="••••••••">
        </div>
      </div>

      <button type="submit" class="w-full bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-500 hover:to-blue-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-purple-500/25 transition-all transform hover:-translate-y-0.5 active:translate-y-0 flex justify-center items-center mt-2">
        Masuk Dashboard
      </button>
    </form>

    <div class="mt-8 text-center text-sm text-slate-400">
      Belum memiliki akun? <a href="register.html" class="text-purple-400 font-bold hover:text-purple-300 hover:underline transition-colors">Daftar sekarang</a>
    </div>
  </main>

  <script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      // Simulasi autentikasi
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
