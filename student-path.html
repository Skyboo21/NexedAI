<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXED AI - Student Dashboard</title>
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Outfit', sans-serif; }
    .glass-nav {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px 4px rgba(168, 85, 247, 0.3); }
      50% { box-shadow: 0 0 35px 8px rgba(168, 85, 247, 0.6); }
    }
    .ai-glow { animation: pulse-glow 2.5s ease-in-out infinite; }
  </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 antialiased min-h-screen flex flex-col relative overflow-x-hidden">

  <!-- Ambient Light Background -->
  <div class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-3xl h-[500px] bg-purple-400/20 rounded-full blur-[120px] opacity-60 pointer-events-none -z-10"></div>
  
  <!-- Header Semantik -->
  <header class="glass-nav shadow-sm sticky top-0 z-50 transition-all" role="banner">
    <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-4">
        <!-- Logo Tim/Proyek -->
        <div class="w-12 h-12 bg-gradient-to-br from-purple-600 to-blue-600 rounded-2xl flex items-center justify-center font-bold text-white shadow-lg shadow-purple-500/30 text-xl">
          NX
        </div>
        <div>
          <h1 class="text-xl font-extrabold text-slate-900 tracking-tight leading-tight">NEXED AI</h1>
          <p class="text-xs text-purple-600 font-bold tracking-wide uppercase">Adaptive Learning</p>
        </div>
      </div>
      <nav aria-label="Navigasi Utama">
        <ul class="flex items-center space-x-8 text-sm font-semibold">
          <li><a href="user-dashboard.html" class="text-slate-500 hover:text-purple-600 transition-colors px-1">Beranda</a></li>
          <li><a href="#" class="text-purple-600 border-b-2 border-purple-600 pb-1.5 px-1 transition-colors" aria-current="page">Peta Belajar</a></li>
          <li class="pl-4 border-l border-slate-200">
            <a href="dashboard.html" class="flex items-center space-x-2 text-slate-500 hover:text-red-500 transition-colors group">
              <span>Keluar</span>
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 transform group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Konten Utama -->
  <main class="max-w-4xl mx-auto px-6 py-16 flex-1 w-full relative z-10" role="main">
    
    <!-- Bagian Profil & Ringkasan Mastery -->
    <section class="mb-20 text-center" aria-labelledby="welcome-heading">
      <div class="inline-flex items-center space-x-2 bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider mb-4 border border-emerald-200 shadow-sm">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>AI Analysis Complete</span>
      </div>
      <h2 id="welcome-heading" class="text-4xl md:text-5xl font-extrabold text-slate-900 mb-4 tracking-tight">Halo, Hariz! 👋</h2>
      <p class="text-slate-500 text-lg max-w-2xl mx-auto font-light leading-relaxed">Sistem AI NEXED telah menganalisis penguasaan (mastery) terakhirmu. Berikut adalah jalur belajar adaptif yang paling optimal untukmu hari ini.</p>
    </section>

    <!-- Bagian Peta Belajar (Skill Tree) -->
    <section aria-labelledby="path-heading" class="relative">
      <h2 id="path-heading" class="sr-only">Jalur Pembelajaran Adaptif</h2>
      
      <!-- Garis Vertikal Tengah untuk Peta -->
      <div class="absolute left-1/2 transform -translate-x-1/2 h-full w-1 bg-gradient-to-b from-purple-200 via-blue-200 to-slate-200 rounded-full z-0"></div>

      <!-- Container untuk Node Peta Belajar (Diisi oleh JavaScript) -->
      <div id="learning-path-container" class="relative z-10 flex flex-col space-y-16" aria-live="polite">
        <!-- Node akan dirender di sini via app.js -->
      </div>
    </section>

  </main>

  <!-- Import Maps untuk ES Modules Browser (Tanpa Bundler) -->
  <script type="importmap">
    {
      "imports": {
        "zod": "https://esm.sh/zod@3.22.4",
        "class-variance-authority": "https://esm.sh/class-variance-authority@0.7.0"
      }
    }
  </script>
  <!-- Script Logika (Modul ES6) -->
  <script type="module" src="app.js"></script>
</body>
</html>
