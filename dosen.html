<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXED AI - Dosen Analytics</title>
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Outfit', sans-serif; }
    .glass-nav {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }
  </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 antialiased min-h-screen flex flex-col relative overflow-x-hidden">

  <!-- Ambient Light Background -->
  <div class="fixed top-0 right-0 w-[600px] h-[600px] bg-blue-400/20 rounded-full blur-[150px] opacity-60 pointer-events-none -z-10"></div>
  <div class="fixed bottom-0 left-0 w-[400px] h-[400px] bg-purple-400/20 rounded-full blur-[120px] opacity-60 pointer-events-none -z-10"></div>

  <!-- Header Semantik -->
  <header class="glass-nav shadow-sm sticky top-0 z-50 transition-all" role="banner">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-4">
        <!-- Logo Tim/Proyek -->
        <div class="w-12 h-12 bg-gradient-to-br from-blue-600 to-indigo-600 rounded-2xl flex items-center justify-center font-bold text-white shadow-lg shadow-blue-500/30 text-xl">
          NX
        </div>
        <div>
          <h1 class="text-xl font-extrabold text-slate-900 tracking-tight leading-tight">Dosen Portal</h1>
          <p class="text-xs text-blue-600 font-bold tracking-wide uppercase">Algoritma Pemrograman</p>
        </div>
      </div>
      <nav aria-label="Navigasi Dosen">
        <a href="dashboard.html" class="flex items-center space-x-2 text-sm font-semibold bg-white border border-slate-200 text-slate-600 hover:text-slate-900 hover:bg-slate-50 px-4 py-2 rounded-xl transition-all shadow-sm">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
          <span>Keluar Dashboard</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-10 space-y-10 w-full relative z-10" role="main">

    <!-- Section 1: Alert Mahasiswa Berisiko -->
    <section aria-labelledby="alert-heading">
      <h2 id="alert-heading" class="text-2xl font-extrabold text-slate-900 mb-6 flex items-center space-x-3">
        <span class="text-3xl">⚠️</span>
        <span>Perhatian Khusus</span>
        <span class="bg-red-100 text-red-700 border border-red-200 text-xs px-3 py-1 rounded-full font-bold uppercase tracking-wider animate-pulse shadow-sm">Real-time Alert</span>
      </h2>
      
      <!-- Container Alert (Dimanipulasi lewat JS) -->
      <div id="alert-container" class="grid grid-cols-1 md:grid-cols-2 gap-6" aria-live="polite">
        <!-- Kartu alert akan dirender di sini via dosen.js -->
      </div>
    </section>

    <!-- Section 2: Tabel Penguasaan (Mastery) -->
    <section class="glass-card rounded-3xl shadow-xl overflow-hidden" aria-labelledby="table-heading">
      <div class="p-8 border-b border-white/50 flex flex-col md:flex-row justify-between items-center gap-4 bg-white/40">
        <div>
          <h2 id="table-heading" class="text-2xl font-extrabold text-slate-900 tracking-tight">Daftar Mastery Mahasiswa</h2>
          <p class="text-sm text-slate-500 font-light mt-1">Pemantauan real-time tingkat penguasaan kelas.</p>
        </div>
        <button id="btn-refresh" class="flex items-center space-x-2 text-sm font-bold bg-white text-blue-600 hover:bg-blue-50 px-5 py-2.5 rounded-xl border border-blue-200 shadow-sm transition-all hover:shadow-md focus:ring-4 focus:ring-blue-500/20">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
          <span>Refresh Data</span>
        </button>
      </div>
      
      <div class="overflow-x-auto p-4">
        <table class="w-full text-left text-sm text-slate-600 border-separate border-spacing-y-2">
          <thead class="text-xs uppercase font-extrabold tracking-wider text-slate-500">
            <tr>
              <th scope="col" class="px-6 py-4">Nama Mahasiswa</th>
              <th scope="col" class="px-6 py-4">Topik Terakhir</th>
              <th scope="col" class="px-6 py-4">Tingkat Penguasaan (Mastery)</th>
              <th scope="col" class="px-6 py-4">Status AI</th>
            </tr>
          </thead>
          <tbody id="student-table-body">
            <!-- Data mahasiswa dirender via JS -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script type="importmap">
    {
      "imports": {
        "zod": "https://esm.sh/zod@3.22.4",
        "class-variance-authority": "https://esm.sh/class-variance-authority@0.7.0"
      }
    }
  </script>
  <script type="module" src="dosen.js"></script>
</body>
</html>
