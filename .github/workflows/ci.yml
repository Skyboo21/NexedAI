name: CI/CD Quality Gate & Build Pipeline (Bab 8: Rust Toolchain)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality-gate:
    name: Biome Lint, Type Safety & Vite Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Biome Linter & Formatter Verification (Rust Toolchain)
        run: npx @biomejs/biome check ./src

      - name: Strict TypeScript Compilation Check
        run: npx tsc --noEmit

      - name: Vite Optimized Production Build (Manual Chunks & Minification)
        run: npm run build

      - name: SonarQube Scan Static Analysis
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        continue-on-error: true
