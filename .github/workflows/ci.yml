name: CI/CD Quality Gate & Production Build Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality-gate:
    name: Lint, Typecheck, Test Coverage & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Biome Linter & A11y Verification (Rust Toolchain)
        run: npx @biomejs/biome check app src tests

      - name: Strict TypeScript Compilation Check
        run: npx tsc --noEmit

      - name: Vitest Unit & Integration Tests (Coverage >= 80%)
        run: npm run test:coverage

      - name: Next.js Production Build Verification
        run: npm run build

      - name: SonarQube / SonarCloud Static Analysis
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
